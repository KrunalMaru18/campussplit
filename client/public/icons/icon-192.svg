<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer glowing accent ring -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
  
  <!-- Inner Card Emblem with Shadow -->
  <g filter="url(#shadow)">
    <!-- Main Center Circle -->
    <circle cx="256" cy="256" r="140" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="6"/>
    
    <!-- Stylized Split Symbol / Currency Symbol (₹ & Arrows) -->
    <!-- Rupee top bar -->
    <path d="M 180 185 L 332 185" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
    <!-- Rupee second bar -->
    <path d="M 180 230 L 290 230" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
    <!-- Rupee curve & diagonal split line -->
    <path d="M 235 230 C 295 230, 295 185, 235 185" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
    <path d="M 220 230 L 320 345" stroke="url(#gold)" stroke-width="28" stroke-linecap="round"/>
    <path d="M 185 345 L 235 345" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Sparkles -->
    <path d="M 360 140 L 368 158 L 386 166 L 368 174 L 360 192 L 352 174 L 334 166 L 352 158 Z" fill="url(#gold)"/>
    <circle cx="150" cy="300" r="8" fill="#fde047"/>
  </g>
  
  <!-- CampusSplit Title -->
  <text x="256" y="440" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="34" fill="#ffffff" letter-spacing="1.5">CAMPUSSPLIT</text>
</svg>