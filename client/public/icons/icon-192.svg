<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6654D9"/>
      <stop offset="100%" stop-color="#917FF2"/>
    </linearGradient>
    <linearGradient id="prism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCD6FF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#17172B" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Base Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  
  <!-- Outer glowing accent ring -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
  
  <!-- Inner Card Emblem with Shadow -->
  <g filter="url(#shadow)">
    <!-- Main Center Circle -->
    <circle cx="256" cy="240" r="140" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="6"/>
    
    <!-- Original Monogram Glyph (Interlocking C + S with Split Node) -->
    <!-- Campus Node C (Top Arc) -->
    <path d="M 330 180 C 310 145, 270 120, 220 120 C 145 120, 95 180, 95 245 C 95 275, 105 305, 125 325" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>
    
    <!-- Split Node S (Bottom Arc) -->
    <path d="M 182 300 C 202 335, 242 360, 292 360 C 367 360, 417 300, 417 235 C 417 205, 407 175, 387 155" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>
    
    <!-- Center Dividing Split Node -->
    <circle cx="256" cy="240" r="42" fill="url(#prism)"/>
    <path d="M 195 300 L 317 180" stroke="#6654D9" stroke-width="26" stroke-linecap="round"/>
  </g>
  
  <!-- CampusSplit Wordmark -->
  <text x="256" y="445" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="2">CAMPUSSPLIT</text>
</svg>
