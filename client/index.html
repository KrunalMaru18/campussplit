<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237c3aed' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8'/><path d='M12 18V6'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CampusSplit – Spend Together, Split Smartly</title>
    <meta name="description" content="Group expense tracking, smart bill splitting and instant debt simplification for college students." />

    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#6654D9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CampusSplit" />
    <meta name="application-name" content="CampusSplit" />

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F7F7FC] dark:bg-[#17172B] text-[#17172B] dark:text-white antialiased selection:bg-[#6654D9] selection:text-white">
    <div id="root">
      <!-- Instant Pre-React Loading Shell (Prevents Blank White Screen on Mobile) -->
      <style>
        .cs-initial-loader {
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #F7F7FC;
          font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          color: #17172B;
          padding: 24px;
          text-align: center;
        }
        @media (prefers-color-scheme: dark) {
          .cs-initial-loader {
            background: #17172B;
            color: #FFFFFF;
          }
        }
        .cs-logo-box {
          width: 56px;
          height: 56px;
          border-radius: 18px;
          background: linear-gradient(135deg, #6654D9 0%, #917FF2 100%);
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 10px 25px -5px rgba(102, 84, 217, 0.4);
          margin-bottom: 16px;
        }
        .cs-logo-svg {
          width: 32px;
          height: 32px;
          stroke: #ffffff;
          fill: none;
          stroke-width: 2.5;
        }
        .cs-title {
          font-size: 22px;
          font-weight: 900;
          letter-spacing: -0.02em;
          margin: 0 0 4px 0;
        }
        .cs-subtitle {
          font-size: 13px;
          color: #7E7D9C;
          margin: 0 0 24px 0;
          font-weight: 600;
        }
        .cs-spinner {
          width: 28px;
          height: 28px;
          border: 3px solid rgba(102, 84, 217, 0.2);
          border-top-color: #6654D9;
          border-radius: 50%;
          animation: cs-spin 0.8s linear infinite;
        }
        @keyframes cs-spin {
          to { transform: rotate(360deg); }
        }
        .cs-slow-hint {
          display: none;
          margin-top: 24px;
          font-size: 12px;
          color: #94a3b8;
          max-width: 280px;
        }
        .cs-reload-btn {
          margin-top: 10px;
          background: #7c3aed;
          color: white;
          border: none;
          padding: 8px 16px;
          border-radius: 10px;
          font-size: 12px;
          font-weight: 600;
          cursor: pointer;
        }
      </style>
      <div class="cs-initial-loader">
        <div class="cs-logo-box">
          <svg class="cs-logo-svg" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" />
            <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8" />
            <path d="M12 18V6" />
          </svg>
        </div>
        <h1 class="cs-title">CampusSplit</h1>
        <p class="cs-subtitle">Spend Together, Split Smartly</p>
        <div class="cs-spinner"></div>
        <div id="cs-slow-notice" class="cs-slow-hint">
          <p>Taking longer than usual?</p>
          <button class="cs-reload-btn" onclick="window.location.reload()">Reload Application</button>
        </div>
      </div>
      <script>
        setTimeout(function() {
          var hint = document.getElementById('cs-slow-notice');
          if (hint) hint.style.display = 'block';
        }, 7000);
      </script>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
